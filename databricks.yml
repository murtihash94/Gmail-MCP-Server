bundle:
  name: gmail-mcp-server

sync:
  include:
    - .build

artifacts:
  default:
    type: whl
    path: .
    build: uv build --wheel

resources:
  apps:
    gmail-mcp-server:
      name: "gmail-mcp-server-bundle"
      description: "Gmail MCP Server on Databricks Apps"
      source_code_path: ./.build

targets:
  dev:
    mode: development
    default: true
