[project]
name = "gmail-mcp-server"
version = "1.1.11"
description = "Gmail MCP server with auto authentication support for Databricks Apps"
readme = "README.md"
authors = [
    { name = "gongrzhe" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "mcp[cli]>=1.10.0",
    "uvicorn>=0.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src_python/gmail_mcp_server"]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
]

[tool.hatch.build.hooks.custom]
path = "hooks/apps_build.py"

[project.scripts]
gmail-mcp-server = "gmail_mcp_server.main:main"
